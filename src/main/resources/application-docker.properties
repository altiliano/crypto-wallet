spring.application.name=management

# Docker Profile - PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://database:5432/crypto_wallet
spring.datasource.username=crypto_user
spring.datasource.password=crypto_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for Docker
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# CoinCap API Configuration
coincap.api-key=${COINCAP_API_KEY:}
coincap.api.base-url=https://api.coincap.io/v2

# Price update configuration
price.update.interval=300000

# Logging
logging.level.com.crypto.wallet=INFO
logging.level.org.springframework.web=INFO
